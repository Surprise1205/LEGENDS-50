
<!DOCTYPE html>
<html>
<head>
    <title>LEGENDS'50 - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="signup">

<header>
    <h1>LEGENDS'50</h1>
    <p>Create your player profile</p>
</header>

<main>
<form id="signupForm">

    <input type="text" id="username" placeholder="Username" required>
    <br><br>

    <input type="password" id="password" placeholder="Password" required>
    <br><br>

    <p>Choose your logo:</p>

    <input type="radio" name="logo" value="logo1.png" required>
    <img src="logo1.jpeg" width="70">

    <input type="radio" name="logo" value="logo2.png">
    <img src="logo2.jpeg" width="70">

    <input type="radio" name="logo" value="logo3.png">
    <img src="logo3.jpeg" width="70">

    <br><br>

    <input type="submit" value="SIGN UP">

</form>

<p>Already have an account? <a href="signin.html">Sign In</a></p>
</main>

<script src="login.js"></script>

</body>
</html>
